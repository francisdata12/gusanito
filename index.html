<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Gusanito Educativo 🐛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-container">
        <h1>🐛 Gusanito Educativo 🍃</h1>
        <p class="menu-subtitle">¡Elige tu aventura y a divertirse!</p>

        <div class="modes-grid">
            <!-- Opción 1: Números -->
            <a href="juego.html?modo=numeros" class="mode-card card-numbers">
                <div class="card-icon">🔢</div>
                <div>
                    <h2>Gusanito Numérico</h2>
                    <p>Busca los números en orden (1, 2, 3...).</p>
                </div>
            </a>

            <!-- Opción 2: Vocales -->
            <a href="juego.html?modo=vocales" class="mode-card card-vowels">
                <div class="card-icon">🅰️</div>
                <div>
                    <h2>Gusanito de Vocales</h2>
                    <p>Encuentra las vocales (A, E, I, O, U).</p>
                </div>
            </a>

            <!-- Opción 3: Abecedario -->
            <a href="juego.html?modo=abecedario" class="mode-card card-alphabet">
                <div class="card-icon">📚</div>
                <div>
                    <h2>Gusanito Alfabético</h2>
                    <p>Recorre el abecedario de la A a la Z.</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
